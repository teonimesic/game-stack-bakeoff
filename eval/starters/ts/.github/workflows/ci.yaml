name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  # Everything that needs no browser. Fast, and it is what gates most PRs.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec prettier --check .
      - name: Types
        run: pnpm exec tsc --noEmit
      # The hexagonal boundary, as a compiler error: src/sim checked with no DOM
      # lib and no node types. A `document` in the simulation fails here.
      - name: Types (src/sim in isolation)
        run: pnpm exec tsc --noEmit -p tsconfig.sim.json
      - name: Lint
        run: pnpm exec eslint .

      # The determinism suite is the highest-value gate in the repo and needs no
      # browser: replay hash chains, tick-count exactness, and the pipeline
      # order assertion.
      - name: Simulation and determinism tests
        run: pnpm exec vitest run --project sim

  # Rendering tests on a CPU-only runner. Chromium's headless shell has no GPU
  # and falls back to ANGLE + SwiftShader, which is a real rasteriser — the same
  # role lavapipe plays for a Vulkan CI job.
  render-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Rendering tests
        run: pnpm exec vitest run --project render
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-diffs-linux
          path: tests/render/artifacts/
          if-no-files-found: ignore

  # macOS runs the same tests on a different host. The rasteriser is pinned to
  # SwiftShader on both, so the golden image is expected to match — if it ever
  # stops matching, that is a finding, not noise to be tolerated.
  render-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Rendering tests
        run: pnpm exec vitest run --project render
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-diffs-macos
          path: tests/render/artifacts/
          if-no-files-found: ignore
# Deliberately NOT here, and why:
#
# * A GPU-backed render job. Every runner here uses SwiftShader on purpose:
#   software rasterisation is bit-reproducible, a real GPU is not, and a golden
#   image that only holds on one vendor's driver is a flaky test with extra
#   steps.
#
# * Wall-clock performance gates. GitHub runners show >30% variance run to run,
#   which is far larger than any regression worth catching. If you want a perf
#   gate, count ticks-per-second over a fixed deterministic replay and compare
#   against a floor generous enough to survive a noisy neighbour, or measure
#   instruction counts instead of time.
