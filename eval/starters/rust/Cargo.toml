[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy_app = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false }
bevy_math = { version = "0.19", default-features = false, features = ["libm"] }
bevy_time = { version = "0.19", default-features = false }
bevy_platform = { version = "0.19", default-features = false, features = ["std"] }
bevy_reflect = { version = "0.19", default-features = false }

# `just lint` runs clippy with `-D warnings`, which is what makes
# crates/sim/clippy.toml's determinism bans hard errors. The cost is that
# purely stylistic lints also become build failures, and a correct feature that
# fails the gate on a style nit is a misleading signal — the same reasoning that
# makes `verify` run `fmt` rather than `fmt-check`.
#
# So: allow the stylistic lints that fire on natural game code and catch no
# bugs. Keep this list short and justify every entry. Nothing here suppresses a
# correctness, perf or determinism lint.
[workspace.lints.clippy]
# ECS systems legitimately take many parameters; that is the framework's design.
too_many_arguments = "allow"
# Query types are structurally complex by nature.
type_complexity = "allow"
# Fires on `tick % PERIOD == 0`, which is the clearest way to express "every N
# ticks" in a fixed-timestep simulation. `u64::is_multiple_of` stabilised very
# recently, so almost every model and every existing Bevy example writes the
# modulo. Measured: it turned a correct periodic-event implementation red.
manual_is_multiple_of = "allow"

# Build-time knobs. These are tuned for "how fast does `just verify` go red or
# green", not for frame rate: `just run` uses the release profile, which is
# untouched.
#
# The usual Bevy advice is `opt-level = 3` for dependencies, because an
# unoptimised wgpu/bevy_render is painfully slow to *run*. That advice assumes
# you are playing the game in a dev build. Here the dev profile only ever runs
# 12 simulation tests and 5 render tests on a 640x400 target, and optimising
# every crate in the Bevy tree to O3 is one of the two largest costs in a cold
# build. Measured (cold `just verify`, with `bevy` already trimmed to 2d):
# 294 s at deps-O3-with-debuginfo, 167 s here. Render tests did not get slower.
[profile.dev]
opt-level = 1
# Line tables keep panic messages pointing at real source lines, which is all a
# test failure needs, without generating (and linking, and writing to disk) full
# DWARF for the whole dependency graph.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
# You are never going to step through wgpu in a debugger from here.
debug = false

[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4
