# Determinism, enforced by the compiler instead of by a bullet point.
#
# Clippy resolves its config from CARGO_MANIFEST_DIR upwards, so this file
# applies to `crates/sim` (and its tests) and to nothing else. `crates/game` is
# presentation and is free to use all of it.
#
# `just lint` runs clippy with `-D warnings`, so every entry below is a hard
# build failure, not advice. `just verify` runs `just lint`.
#
# If you hit one of these and genuinely need the item, that is a design
# conversation — say so out loud. Do not edit this file to get unblocked.

disallowed-types = [
    { path = "std::time::Instant", reason = "the simulation has no wall clock. Use `Tick`, which is part of snapshotted state and therefore replayable." },
    { path = "std::time::SystemTime", reason = "the simulation has no wall clock. Use `Tick`." },
    { path = "std::collections::HashMap", reason = "std's hasher is randomly seeded per process, so iteration order differs between runs of the same replay. Use `BTreeMap`." },
    { path = "std::collections::HashSet", reason = "std's hasher is randomly seeded per process, so iteration order differs between runs of the same replay. Use `BTreeSet`." },
    { path = "bevy_platform::collections::HashMap", reason = "fixed-seed, so stable within a build, but iteration order still depends on insertion history and capacity. Anything that is hashed, sorted or sent over the wire must use `BTreeMap`." },
    { path = "bevy_platform::collections::HashSet", reason = "iteration order depends on insertion history. Use `BTreeSet`." },
]

# f32/f64 transcendentals in `std` call the *platform's* libm: Apple's, glibc's
# and MSVC's give different last bits for the same input. One differing bit in a
# launch angle diverges a replay within seconds. `bevy_math::ops::*` routes
# through the vendored pure-Rust `libm` (the `bevy_math/libm` feature, asserted
# by `tests/boundary.rs`) and is bit-identical everywhere.
#
# Not banned, deliberately: `sqrt`, `abs`, `floor`, `ceil`, `round`, `trunc`,
# `min`, `max`, `clamp`, `to_bits`. IEEE-754 specifies those exactly, so every
# conforming platform already agrees.
disallowed-methods = [
    { path = "f32::sin", reason = "use `bevy_math::ops::sin` — platform libm is not bit-identical across OSes." },
    { path = "f32::cos", reason = "use `bevy_math::ops::cos`." },
    { path = "f32::tan", reason = "use `bevy_math::ops::tan`." },
    { path = "f32::sin_cos", reason = "use `bevy_math::ops::sin_cos`." },
    { path = "f32::asin", reason = "use `bevy_math::ops::asin`." },
    { path = "f32::acos", reason = "use `bevy_math::ops::acos`." },
    { path = "f32::atan", reason = "use `bevy_math::ops::atan`." },
    { path = "f32::atan2", reason = "use `bevy_math::ops::atan2`." },
    { path = "f32::powf", reason = "use `bevy_math::ops::powf`." },
    { path = "f32::powi", reason = "use `bevy_math::ops::powf` or repeated multiplication; `powi` lowers to an LLVM intrinsic whose accuracy is unspecified." },
    { path = "f32::exp", reason = "use `bevy_math::ops::exp`." },
    { path = "f32::ln", reason = "use `bevy_math::ops::ln`." },
    { path = "f32::log", reason = "use `bevy_math::ops::log`." },
    { path = "f32::log2", reason = "use `bevy_math::ops::log2`." },
    { path = "f32::log10", reason = "use `bevy_math::ops::log10`." },
    { path = "f32::cbrt", reason = "use `bevy_math::ops::cbrt`." },
    { path = "f32::hypot", reason = "use `bevy_math::ops::hypot`." },
    { path = "f64::sin", reason = "the simulation is f32 throughout; mixing in f64 transcendentals is both nondeterministic across platforms and a sign of an accidental widening." },
    { path = "f64::cos", reason = "the simulation is f32 throughout." },
    { path = "f64::powf", reason = "the simulation is f32 throughout." },
    { path = "std::time::Instant::now", reason = "the simulation has no wall clock. Use `Tick`." },
    { path = "std::time::SystemTime::now", reason = "the simulation has no wall clock. Use `Tick`." },
]
