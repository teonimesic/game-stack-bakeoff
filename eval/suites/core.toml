name = "core"

# ---------------------------------------------------------------------------
# Arms: instruction variants to A/B.
#
# Every arm runs the SAME tasks so the report can use paired per-task
# differences, which cut estimator variance by roughly a third for free
# (Miller, arXiv:2411.00640 sec 4).
# ---------------------------------------------------------------------------

[arms.baseline]
# The template exactly as shipped.
model = "opus"

[arms.no_instructions]
# Ablates the whole agent-facing layer. Measures what AGENTS.md is worth.
# Prior published measurement (ETH Zurich, arXiv:2602.11988) found context files
# give ZERO correctness gain and cost >20% more tokens, while a separate study
# found -28% wall-clock. If that replicates here, the honest framing of
# AGENTS.md is "efficiency, not correctness".
model = "opus"
remove_files = ["AGENTS.md", "CLAUDE.md"]

[arms.no_api_notes]
# Keeps AGENTS.md but strips the Bevy 0.19 "what you remember -> what is true
# now" delta table. This is the grounding hypothesis, and the one the research
# says is most likely to matter: RustEvo2 measured a -23.6pp drop on post-cutoff
# APIs, and Bevy shipped ~103 breaking changes in 0.18->0.19 alone.
model = "opus"
replace_files = { "AGENTS.md" = "variants/AGENTS.no-api-notes.md" }
# The delta table in AGENTS.md points at this file, so the ablation has to
# remove both or the agent can still find the grounding.
remove_files = ["docs/bevy-0.19-notes.md"]

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------

[[task]]
id = "t1_rally"
notes = "Pure simulation logic. No engine API surface, no rendering. The control: if a stack loses elsewhere but wins here, the deficit is churn, not language."
prompt = """
Add a rally counter to the game simulation.

Requirements:
- A public Bevy resource `RallyLength(pub u32)` defined in `crates/sim` and
  exported from the crate root (so `sim::RallyLength` resolves).
- It counts consecutive paddle hits since the last point was scored.
- It increases by one for every paddle hit. A single tick can contain more than
  one hit.
- It resets to zero on the tick a point is scored.
- It starts at zero and is registered by `SimPlugin`.
- It must be part of deterministic simulation state: two runs with the same seed
  must agree on its value at every tick.

Add tests covering the behaviour, then make sure `just verify` passes.
"""
allowed_paths = ["crates/sim/src/**", "crates/sim/tests/**"]
holdout_src = "eval/holdout/t1_rally"
holdout_cmd = "cargo nextest run -p sim --test holdout_rally"
max_turns = 50
max_budget_usd = 3.0

[[task]]
id = "t2_net"
notes = "Rendering. Grading looks at real pixels from the headless GPU harness, so 'it compiles' and 'the code looks right' both score zero."
prompt = """
Draw a centre net in the game's rendered output: a vertical line down the middle
of the arena, like the dividing line in Pong.

Requirements:
- It must be visible in the rendered frame, spanning most of the arena height.
- It must not obscure gameplay - the paddles and ball must remain clearly
  visible, and the net must stay narrow.
- It is presentation only. It must not affect the simulation or collisions.

Add a test that proves the net actually renders, then make sure `just verify`
passes.
"""
allowed_paths = ["crates/game/src/**", "crates/game/tests/**"]
holdout_src = "eval/holdout/t2_net"
holdout_cmd = "cargo nextest run -p game --test holdout_net"
max_turns = 60
max_budget_usd = 4.0
timeout_s = 3000

[[task]]
id = "t3_powerup"
notes = "A determinism trap. The obvious implementation (thread_rng / SystemTime) passes review and fails the held-out replay comparison. Directly measures whether the determinism section of AGENTS.md lands."
prompt = """
Add a collectable powerup to the game simulation.

Requirements:
- A public marker component `Powerup` in `crates/sim`, exported from the crate
  root, on an entity that also has a `Position`.
- Exactly one powerup exists at a time. Every 200 ticks it moves to a new
  randomly chosen position inside the arena.
- It must always be inside the arena bounds.
- Its position must be reproducible: two runs of the simulation with the same
  seed must place it identically at every tick, and different seeds must produce
  different placements.
- It does not need to interact with the ball or the paddles yet.

Add tests covering the behaviour, then make sure `just verify` passes.
"""
allowed_paths = ["crates/sim/src/**", "crates/sim/tests/**"]
holdout_src = "eval/holdout/t3_powerup"
holdout_cmd = "cargo nextest run -p sim --test holdout_powerup"
max_turns = 50
max_budget_usd = 3.0
