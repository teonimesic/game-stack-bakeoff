# Rendering tests each construct a full Bevy render App with its own GPU device.
# Running several concurrently in one process causes GPU contention and a global
# logger conflict, and produces flaky empty frames. Measured: 5/5 pass serially,
# 4/5 in parallel, reproducibly.
#
# So: render tests get a serial test group. Everything else stays parallel.
[test-groups]
render = { max-threads = 1 }

[profile.default]
# nextest calls a test "leaky" if its output pipes are still open shortly after
# the process exits. The boundary tests shell out to `cargo tree`, and under
# that load an unrelated test process can take longer than the 100 ms default to
# tear down — producing a LEAK annotation on a test that did nothing wrong.
# It is only ever a warning, but a warning an agent cannot act on is noise.
leak-timeout = "1s"

[[profile.default.overrides]]
filter = 'package(game) and test(/^render/)'
test-group = 'render'

[[profile.default.overrides]]
filter = 'binary(render)'
test-group = 'render'
slow-timeout = { period = "60s" }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
status-level = "fail"
