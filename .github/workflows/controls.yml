# The SLOW tier: the mutant suites, and the two selftests that spend real seconds.
#
# Split out of gates.yml for one reason and it is not tidiness: LATENCY. These suites take
# minutes where the fast tier takes seconds, and both are required checks, so running them
# on every event would put the whole slow tier in front of every merge for checks whose
# inputs are only source. What each tier takes is in .github/workflows/README.md and only
# there -- read it from the register, never from a comment that cannot be disagreed with.
#
# It WAS a billing split, back when the repository was private and Actions minutes were
# metered. Wall clock is what keeps the tiers apart now. Whether a minute is also billed is
# read by `ci_minutes.py` on every census and printed in its header -- not asserted here,
# because an assertion in a comment outlives the fact it was true of.
#
# THE FILTER IS NOT IN `on:`, AND THAT IS THE WHOLE POINT OF THIS SHAPE. A workflow whose
# `paths:` do not match produces NO check, not a passing one, and `controls` is a required
# check -- so a pull request touching only `tasks/` or a root document waited on a check
# that could never arrive. Measured at PR #14's head: 2 `gates` runs, 0 `controls`.
# The job now runs on every pull request, decides in its FIRST step whether its suites have
# anything to read, and skips the rest when they do not. The check therefore always reports.
#
# WHAT THE FILTER IS CLAIMING, so it can be argued with: every check here reads source
# under eval/, or the skill layout under .agents/ and .claude/, and nothing else.
# bot_mutants mutates judge criteria, tasks_mutants mutates a COPY of eval/tools/tasks.py,
# audio/rusage are fixture-driven, and skill_layout_control plants and restores five
# breakages of the symlink. A change to a document or a task file cannot alter their
# verdict. Anything that reads a document or the queue is in gates.yml and runs
# unconditionally, precisely because a path filter on those would be a gate that is
# silently absent.
#
# The filter itself is spelled ONCE, as FILTER_PREFIXES/FILTER_EXACT in
# eval/tools/ci_minutes.py, and the scope step prints it into this log on every run. It is
# deliberately not repeated here: a comment listing paths is a second copy that nothing can
# disagree with.
#
# The claim is checked by running the suite unconditionally wherever nothing is waiting on
# the result -- every push to main, and nightly. A filter that is wrong is therefore wrong
# for at most one merge rather than indefinitely.
name: controls

on:
  pull_request:
  push:
    branches: [main, 'ci-control-**']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # tasks_mutants exits 2 on a shallow clone -- measured. The scope step also needs
          # this pull request's merge commit to have both its parents.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # THE FILTER, evaluated here instead of in `on:`. It writes `relevant=true|false`,
      # and every step below is guarded on `!= 'false'` -- never `== 'true'`. An output
      # that was never written is the empty string: `!= 'false'` runs the suites anyway,
      # while `== 'true'` would skip them all and report a green `controls` that executed
      # nothing, which is the one pattern this project exists to catch. The only way to
      # skip is for this step to have run and said so, and it prints what it read.
      # `ci_minutes.py --selftest` pins the wiring, in both directions.
      - name: scope (does this pull request touch anything these suites read?)
        id: scope
        run: python3 eval/tools/ci_minutes.py --scope

      - name: install pyyaml
        if: ${{ success() && steps.scope.outputs.relevant != 'false' }}
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.2

      # `just` is NOT a stack toolchain here. bot_mutants drives eval/judge/fixtures/*,
      # whose justfiles run `python3` and nothing else -- `just` is only the recipe runner.
      # It refuses to run without it (exit 2, fail-closed), which is how CI found this.
      # Pinned to the operator's version so a recipe cannot behave differently in the two
      # places. Downloaded to a file rather than piped into tar: a pipeline's exit status
      # is the last stage's (AGENTS.md rule 3).
      - name: fetch just 1.58.0
        if: ${{ success() && steps.scope.outputs.relevant != 'false' }}
        run: curl -fsSL -o /tmp/just.tar.gz https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
      - name: install just
        if: ${{ success() && steps.scope.outputs.relevant != 'false' }}
        run: sudo tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
      - name: just --version
        if: ${{ success() && steps.scope.outputs.relevant != 'false' }}
        run: just --version

      # ffmpeg is what `judge/audio.py` measures loudness and silence with, so
      # audio_selftest exits 2 without it -- fail-closed, and again a dependency nothing
      # had ever named because every machine that ran the judge had it. Not a stack
      # toolchain: no engine, no compiler, no package manager for a submission.
      - name: install ffmpeg (judge/audio.py's measuring instrument)
        if: ${{ success() && steps.scope.outputs.relevant != 'false' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      # `if: !cancelled()` on every gate: one red gate must not hide the verdict of the
      # others. Without it a broken run reports one failure per push, and clearing three
      # takes three pushes, and a required check cleared one failure at a time is a merge
      # blocked for as many round trips as it has defects.
      # NOT a count. The step name used to carry three cardinals and they were stale the
      # first time the suite grew -- a cardinal in a step name has no producer, which is
      # the failure AGENTS.md's counts rule is about. The suite's own closing line is the
      # producer, and `--hazards` prints the per-criterion registry behind it.
      - name: judge/bot_mutants (mutants, variants, pending subjects, session-lock controls)
        if: ${{ !cancelled() && steps.scope.outputs.relevant != 'false' }}
        run: python3 eval/judge/bot_mutants.py
      # A mutant asks whether a criterion can fail; this asks the other question --
      # whether any criterion rests on something the task prompt leaves FREE. It also
      # produces the tick census eval/RUNS.md quotes for the twenty-third comparability
      # break, so that figure has a producer rather than a memory.
      - name: judge/aim_contract_control (the arena aim contract, and what is free in it)
        if: ${{ !cancelled() && steps.scope.outputs.relevant != 'false' }}
        run: python3 eval/judge/aim_contract_control.py
      # The scene probe's own both-directions suite: every criterion in
      # judge/scene_probe.py against its reference, against a mutant that removes the
      # behaviour it names, and against correct scenes the reference does not resemble.
      # `just` is again only the recipe runner - the two scene fixtures run python3.
      - name: judge/scene_mutants (the scene probe, both directions)
        if: ${{ !cancelled() && steps.scope.outputs.relevant != 'false' }}
        run: python3 eval/judge/scene_mutants.py
      # Can the census say NO? It reads no fixture and needs no toolchain, so it runs
      # even when the suite above cannot: a census that has only ever printed `yes` is
      # indistinguishable from one that cannot print anything else.
      - name: judge/scene_mutants --census-selftest
        if: ${{ !cancelled() && steps.scope.outputs.relevant != 'false' }}
        run: python3 eval/judge/scene_mutants.py --census-selftest
      # NOT a count. This said "the five mutants" while there were 21, and task 122 made it
      # 25 -- a cardinal in a step name has no producer and cannot be checked, which is the
      # failure AGENTS.md's counts rule is about. `tasks_mutants.py --list` is the producer.
      - name: tasks_mutants (every mutant tasks_control's rows must catch)
        if: ${{ !cancelled() && steps.scope.outputs.relevant != 'false' }}
        run: python3 eval/tools/tasks_mutants.py
      - name: judge/audio_selftest
        if: ${{ !cancelled() && steps.scope.outputs.relevant != 'false' }}
        run: python3 eval/judge/audio_selftest.py
      - name: judge/rusage_selftest
        if: ${{ !cancelled() && steps.scope.outputs.relevant != 'false' }}
        run: python3 eval/judge/rusage_selftest.py
      # 124.7s, and it plants five breakages in the skill layout and restores them. The
      # `.claude/skills` symlink is load-bearing and fails silently, so this is exactly the
      # kind of gate nobody would remember to run.
      - name: skill_layout_control (the .agents/.claude symlink, five ways it can break)
        if: ${{ !cancelled() && steps.scope.outputs.relevant != 'false' }}
        run: python3 eval/tools/skill_layout_control.py
