# The SLOW tier: the mutant suites, and the two selftests that spend real seconds.
#
# Split out of gates.yml for one reason and it is not tidiness: this repository is
# PRIVATE, so Actions minutes are metered against a monthly account allowance. These
# four steps are 281s measured (bot_mutants alone is 226s) against the fast tier's 42s,
# so running them on every event would be ~6x the bill for checks whose inputs are
# ONLY the code under eval/.
#
# WHAT THE PATH FILTER IS CLAIMING, so it can be argued with: every check here reads
# source under eval/ and nothing else. bot_mutants mutates judge criteria, tasks_mutants
# mutates a COPY of eval/tools/tasks.py, and audio/rusage are fixture-driven. A change
# to a document or a task file cannot alter their verdict. Anything that reads a
# document or the queue is in gates.yml and runs unconditionally, precisely because a
# path filter on those would be a gate that is silently absent.
#
# The nightly run exists because a path filter is a claim, and the claim is checked by
# running the suite on main whether or not anything under eval/ moved.
name: controls

on:
  pull_request:
    paths:
      - 'eval/**'
      - '.github/workflows/controls.yml'
  push:
    branches: [main, 'ci-control-**']
    paths:
      - 'eval/**'
      - '.github/workflows/controls.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tasks_mutants exits 2 on a shallow clone -- measured
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: judge/bot_mutants (36 criteria both ways, 4 variants, 3 session-lock controls)
        run: python3 eval/judge/bot_mutants.py
      - name: tasks_mutants (the five mutants tasks_control's rows must catch)
        run: python3 eval/tools/tasks_mutants.py
      - name: judge/audio_selftest
        run: python3 eval/judge/audio_selftest.py
      - name: judge/rusage_selftest
        run: python3 eval/judge/rusage_selftest.py
