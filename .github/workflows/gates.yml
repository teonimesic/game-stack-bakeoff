# The FAST tier: every gate that reads documents, the queue, or a register.
#
# This tier is a REQUIRED check on main, so a merge waits on it -- which is why the slow
# mutant suites live in controls.yml and this one stays fast. What each tier takes, and
# what is deliberately NOT here, is in .github/workflows/README.md and only there: a
# timing copied into a comment is a figure nothing can disagree with. What the split buys
# is LATENCY. It began as a billing split, back when the repository was private and Actions
# minutes were metered; whether they are metered today is read by `ci_minutes.py` on every
# census rather than asserted in a comment, which is how the old assertion outlived it.
#
# EVERY GATE IS ITS OWN STEP. A `run: |` block reports only its last command's exit
# status (AGENTS.md rule 3), so a multi-command step is a step that can pass while a
# gate inside it failed. One command per step, no pipes, no `|| true`.
name: gates

on:
  pull_request:
  push:
    # Agent branches are pushed often and reviewed as PRs, where the pull_request trigger
    # already covers them, so the push trigger is narrowed to main. `ci-control-**` exists
    # to re-prove the push path itself -- see the control in tasks/110.
    branches: [main, 'ci-control-**']

# The job runs code out of the repository, and on a pull_request that code can come from
# the branch under review. Least privilege for the token it can see, and the checkout
# credential is not written into .git/config where a step could read it. Raised by
# CodeRabbit on PR #3; costs nothing, and nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest   # Linux, the 1x multiplier; nothing here needs macOS
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # MEASURED, not assumed. At depth 1 four controls fail closed and one loses 5
          # of 28 rows to NOT CHECKED: tasks_control exit 3, withdrawn_control exit 1,
          # dead_private_control exit 3, tasks_mutants exit 2. They read blobs at named
          # revisions. A shallow clone has no history to measure, and that is not the
          # same as a passing check.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          # Pinned to the operator's local interpreter (3.14.6, measured 2026-08-23).
          # An unpinned toolchain is a gate that will disagree with the machine the
          # work is done on and be blamed for it.
          python-version: '3.14'

      # pyyaml: eval/tools/tasks_control.py parses frontmatter out of git history, and
      #         eval/tools/lint_coverage.py --selftest re-derives its figure through it.
      # ruff:   eval/tools/lint.py. Pinned exactly -- the syntax-error finding is
      #         reported under the code `invalid-syntax`, and a version that renames it
      #         would turn the gate below into a step that cannot fail.
      - run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.2 ruff==0.16.4

      # `if: !cancelled()` on every gate: one red gate must not hide the verdict of the
      # others. Without it a broken run reports one failure per push, and clearing three
      # takes three pushes, and a required check cleared one failure at a time is a merge
      # blocked for as many round trips as it has defects.

      # ---- the documentation gates -------------------------------------------------
      - name: docstat --selftest (the sweep's own pins, in both directions)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/docstat.py --selftest
      - name: docstat --findings (the producer for any count of the findings log)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/docstat.py --findings
      - name: docstat --withdrawn (a retired figure restated as current)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/docstat.py --withdrawn
      - name: docstat --sweep (names in docs that do not resolve, plus structure)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/docstat.py --sweep
      - name: linkcheck (markdown links that resolve to nothing)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/linkcheck.py
      # The mode, not the bare run above: it pins the link grammar and the GitHub anchor
      # rule the bare form leans on, on a temp tree whose answers are stated in advance.
      # Bare-but-not-the-mode was the shape task 180 filed; `ci_minutes --controls`
      # now reads the two as different invocations. 0.04s locally.
      - name: linkcheck --selftest (the anchor rule the bare form leans on)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/linkcheck.py --selftest
      # `docstat`'s duplicate-fragment check, both ways, over the live document corpus. Its
      # `whole_line` mutant is the design that was tried first and measured as a complete
      # false negative, so this is what stops that being tried again silently -- and until
      # 2026-08-27 nothing ran it. 0.42s locally. It reads a historical blob for its REAL
      # row, so it needs the `fetch-depth: 0` checkout above; in a shallow clone it goes RED
      # rather than skipping, because no hits with nothing to find is indistinguishable from
      # a check that cannot fire.
      - name: fragment_control (the duplicate-fragment check, and the mutant it kills)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/fragment_control.py
      # WHICH FILES THE SWEEP READS. `docstat --selftest` above makes the same clean call;
      # this one RUNS THE MUTANTS, which is why it is a separate step. On a clean checkout
      # the filesystem and the index hold the same documents, so the glob this replaced
      # passes every live row -- the discriminating input is a throwaway git repository
      # under $TMPDIR holding markdown that is NOT in it. 3.9s locally, 7 mutants.
      - name: corpus_control (an untracked .md cannot join the swept corpus)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/corpus_control.py

      # ---- the queue ---------------------------------------------------------------
      - name: tasks.py check
        if: ${{ !cancelled() }}
        run: python3 eval/tools/tasks.py check

      # ---- source ------------------------------------------------------------------
      # NOT `lint.py --gate`. That gates the whole pinned set, which stands at 97
      # findings (`python3 eval/tools/lint.py --counts`, read 2026-08-25) with an
      # untriaged backlog; wiring it red on day one teaches everyone
      # to skip CI. `invalid-syntax` is the subset that is at zero today and can still
      # go red -- pinned both ways in tasks/110.
      - name: lint.py, syntax errors only
        if: ${{ !cancelled() }}
        run: python3 eval/tools/lint.py --gate --rule invalid-syntax
      - name: lint_coverage --selftest (the 7.1% figure's pins)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/lint_coverage.py --selftest
      # Offline: it asserts the billing arithmetic, that an in-flight job stays out of the
      # total, and that FILTER_* here still matches controls.yml's `paths:`. The API half
      # is NOT run in CI -- it would spend an API call per run on every push, and it needs
      # no network to go red on the thing that would actually rot.
      - name: ci_minutes --selftest (the minutes producer, and controls.yml's filter)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/ci_minutes.py --selftest
      # Three census producers whose `--selftest` pins their extraction on fixtures whose
      # answers are stated before the tool runs. All offline, all under 0.06s locally;
      # each ran in
      # no tier and under no register row until task 180, which is the gap
      # `ci_minutes --controls` now closes.
      - name: tools/census --selftest (the stored-tree producer's pins)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/census.py --selftest
      # `--skip-corpus` because the corpus arm reads `eval/runs/`, which is gitignored,
      # and disclosure refuses rather than scoring an absent corpus as clean — its own
      # three-valued design (corpus / skip-corpus / UNMEASURABLE). The wholegame report
      # path that consumes this tool is graded by rule 11, which is why the pins matter.
      # 0.06s locally.
      - name: tools/disclosure --selftest --skip-corpus (the disclosure locator's pins)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/disclosure.py --selftest --skip-corpus
      - name: tools/instruction_census --selftest (every count can rise and return to zero)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/instruction_census.py --selftest

      # ---- the prompts and the packs -----------------------------------------------
      - name: prompt_guard (engine names, per-stack rules, scene rubric vocabulary)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/prompt_guard.py
      # The three assertions above cannot see a shared-preamble edit -- it leaves every
      # rule identical across stacks and names no engine, which is exactly #41. Only the
      # rendered text against a stored copy catches it, so the snapshot is checked in and
      # this diffs against it. Regenerate deliberately: --snapshot eval/suites/rendered.
      - name: prompt_guard --diff (rendered prompts match the checked-in snapshot)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/prompt_guard.py --diff eval/suites/rendered
      - name: prompt_guard_control (can the prompt guard fail, and still pass?)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/prompt_guard_control.py
      # A flag's `dest` is the address `wholegame.py` reads it at, and `--harness` is a
      # recorded arm dimension. A dest that moves out from under its reader does not crash
      # the run -- it completes and records the default as the arm -- so the binding is
      # asserted before a launch rather than during one.
      - name: flag_binding (every flag wholegame.py reads is one its parser produces)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/flag_binding.py
      - name: flag_binding_control (can that checker fail, and still pass?)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/flag_binding_control.py
      - name: manifest_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/tools/manifest_selftest.py
      # The producer for README's cost result. Only --selftest runs here: the tool itself
      # needs eval/runs/, which is gitignored and exits 2 in any checkout. The selftest
      # builds its own trees under tempfile and never touches the stored corpus.
      - name: cost_census --selftest (README's cost result, pinned both ways)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/cost_census.py --selftest
      # The selftest going green establishes nothing on its own. This is the producer for
      # the mutant count DECISIONS.md publishes, and it needs no corpus either.
      - name: cost_census_mutants (can that selftest fail?)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/cost_census_mutants.py
      # The wall-clock reconciliation `eval/RUNS.md` quotes. Only --selftest runs here,
      # for the same reason as cost_census: the tool itself needs eval/runs/, which is
      # gitignored and exits 2 in any checkout. The mutant half is the producer for the
      # count that says the selftest can fail at all.
      - name: wallclock --selftest (the two clocks agree, pinned both ways)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/wallclock.py --selftest
      - name: wallclock_mutants (can that selftest fail?)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/wallclock_mutants.py
      # The review poll an agent runs against its own pull request. Both halves are offline:
      # --selftest injects its own `gh` runner and its own clock, so nothing here touches the
      # network or the GitHub API. The mutant sweep is the producer for the count DECISIONS.md
      # publishes, and the whole pair is 1.1s measured.
      - name: pr_review_state --selftest (the review poll's guards, pinned both ways)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/pr_review_state.py --selftest
      - name: pr_review_state_mutants (can that selftest fail?)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/pr_review_state_mutants.py
      # Every `$` in this project is a list-price valuation of tokens, not money (#159).
      # This reads all 11 producer sources and fails if any of them formats a figure with a
      # money sigil, and re-derives the producer list from the tree so a new one shows up.
      - name: tokenvalue --selftest (no producer prints a money sigil)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/tokenvalue.py --selftest
      # `.coderabbit.yaml` carried 894 characters in a field the schema caps at 250, from
      # 2026-08-23, and every check was green: --schema audits `reviews.tools` and nothing
      # else. This walks the scalar constraints against a CACHED schema, so it is offline and
      # can gate. --schema refreshes the cache; this fails closed if the cache is missing.
      - name: coderabbit_config --constraints (an over-long field can void the whole file)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/coderabbit_config.py --constraints
      # Main went red on a merge while both contributing pull requests were green: each
      # was tested against a base containing neither, and one was merged 12 commits behind
      # with no run at its final head. GitHub now enforces both natively -- `strict`
      # required status checks, enabled when the repository went public -- and this stays as
      # the pre-flight that says WHY a merge is refused. Offline half only: the API half
      # needs `gh` and a live pull request.
      - name: mergeable --selftest (green at a stale head is not mergeable)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/mergeable.py --selftest
      # The selftest going green establishes nothing on its own. This removes each
      # mechanism that selftest names -- including the reviewer's status description,
      # which the rollup does not carry -- and requires a named red row for every one.
      - name: mergeable_mutants (can that selftest fail?)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/mergeable_mutants.py
      # The judge sweep's bounds. Python-only: it drives no CLI, it exercises the Bounds
      # object directly and reads field_sweep.py's tokenised source.
      - name: sweep_bounds_control (the sweep still stops, and not on a money figure)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/sweep_bounds_control.py
      # A missing `agent.cost_usd` printed `n/a` in the row and summed as 0.00 into the
      # total below it. This pins the aggregation against that in a temp tree, with the
      # old expression evaluated beside it as the mutant.
      - name: runstat --selftest (an unmeasured figure is not a zero)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/runstat.py --selftest

      # ---- the controls that check the checkers ------------------------------------
      - name: findings_control
        if: ${{ !cancelled() }}
        run: python3 eval/tools/findings_control.py
      # The mode, not the bare run above: it pins the two refusals `build` applies its
      # mutants through - an anchor absent from docstat.py refuses, and an anchor
      # MEASURED at run time to occur more than once refuses, so the pin moves with the
      # code instead of hardcoding a line one edit would leave stale - and a real mutant
      # must still apply exactly once, or a `build` that refuses everything would read
      # green. Pass 39 verified both refusals by ad-hoc invocation only. 0.09s locally.
      - name: findings_control --selftest (the refusals the mutants apply through)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/findings_control.py --selftest
      - name: withdrawn_control
        if: ${{ !cancelled() }}
        run: python3 eval/tools/withdrawn_control.py
      - name: triage_control
        if: ${{ !cancelled() }}
        run: python3 eval/tools/triage_control.py
      - name: tasks_control
        if: ${{ !cancelled() }}
        run: python3 eval/tools/tasks_control.py
      - name: dead_private_control
        if: ${{ !cancelled() }}
        run: python3 eval/tools/dead_private_control.py
      - name: backup_evidence_control
        if: ${{ !cancelled() }}
        run: python3 eval/tools/backup_evidence_control.py
      - name: hook_audit_control
        if: ${{ !cancelled() }}
        run: python3 eval/tools/hook_audit_control.py
      # The heartbeat refuses on two addresses, and nothing but this asks about either.
      # The address guard (`tasks/229`): the counts read the tree the RUNNING COPY lives
      # in, so a linked worktree's copy would count branch-local, plausible and wrong --
      # pinned red, and it runs FIRST, so every refusal a worktree copy can get names both
      # addresses, even when the main checkout is broken too. The work-tree guard: the
      # counts are byte-identical whether or not the main checkout is a work tree; pinned
      # red on both settings that reach that state, green on the two where the checkout is
      # fine. The live row adapts to where this control itself runs: CI is the main
      # checkout, agent commits are not.
      # About 1s locally: `time python3 eval/tools/heartbeat_control.py`.
      # 2 runs of that command, minutes apart, differed by 28%. Throwaway git
      # repositories under $TMPDIR: a local fixture commit, no project history,
      # no toolchain.
      - name: heartbeat_control (a work-tree main checkout, and only its copy counts)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/heartbeat_control.py
      # The agent CLI became a variable on 2026-08-24, and nothing in a stored artifact
      # records which command line built a trial. This pins the claude arm's argv against a
      # literal in three configurations, and carries 12 mutants over the parsing and
      # normalisation both arms share -- including the one the commissioning ticket got
      # wrong: prime-agent's per-message usage is not cumulative, so reading the terminal
      # event under-reports every multi-turn trial. Offline, ~1 s.
      - name: agent_harness_control (the argv, and the readers of what comes back)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/agent_harness_control.py

      # ---- the judge's cheap selftests ---------------------------------------------
      - name: judge/aspects_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/aspects_selftest.py
      - name: judge/anonymise_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/anonymise_selftest.py
      - name: judge/blind_dir_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/blind_dir_selftest.py
      - name: judge/blind_ext_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/blind_ext_selftest.py
      - name: judge/blurb_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/blurb_selftest.py
      # The red half of `blurb_selftest`'s stored-round census arm. That census reads
      # `eval/runs/`, which is gitignored, so the fixture inside the selftest is the only
      # thing any gate can see it through - and a green fixture is the shape rule 1
      # distrusts. Offline: 4.3 s over 8 runs of a 0.6 s selftest against a symlinked
      # mirror, plus 1.7 s over 3 more for --variant-control.
      - name: judge/stored_rounds_mutants (can the census arm fail?)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/stored_rounds_mutants.py
      - name: judge/stored_rounds_mutants --variant-control (is the variant load-bearing?)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/stored_rounds_mutants.py --variant-control
      - name: judge/capability_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/capability_selftest.py
      - name: judge/gate_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/gate_selftest.py
      # The half of the gate `gate_selftest` cannot reach: it drives `gate_verdict` on
      # tier-1 records handed to it, and says nothing about whether a CRITERION'S BOUND
      # is calibrated on anything. `render.nonempty`'s ink ceiling had 0 true positives and
      # 2 false negatives in 85 stored gradings and is gone (tasks/163, tasks/168); this
      # also carries the derivation for its removal as measured rows on real pixels, and
      # the restored 0.85 as a mutant. About 4.6 s locally (2026-08-29,
      # `time python3 eval/judge/ink_window_control.py`; the ~30 s this comment carried
      # until tasks/212 was the fixture phases' per-pixel ink reads, now vectorised in
      # eval/judge/png.py and pinned against the shipped per-pixel loops by the file's
      # reader-pin phase -- what dominates now is those pin loops plus zlib). It writes
      # its own PNGs through eval/judge/png.py and stubs every subprocess
      # `static.collect` makes, so it needs neither `just` nor a toolchain.
      # The corpus arm reads eval/runs, which is gitignored, and prints NOT ASKED here.
      - name: judge/ink_window_control (render.nonempty's floor, both directions)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/ink_window_control.py
      - name: judge/pack_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/pack_selftest.py
      # The retired 13-criterion judge refuses a game with no GAME_BRIEF entry, as a
      # recorded verdict, before the pack is built (tasks/221). Pins the refusal's literal
      # fields, the spend-free path, the KeyError backstop in _brief, the CLI's argparse
      # refusal, and the census extraction over stored judge.json files - on fixtures
      # whose answer is written as literals, plus 2 mutants. Its corpus arm reads
      # eval/runs, which is gitignored, and prints NOT ASKED here. 0.1s locally
      # (2026-08-30, `time python3 eval/judge/judge_refusal_selftest.py`).
      - name: judge/judge_refusal_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/judge_refusal_selftest.py
      - name: judge/sequential_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/sequential_selftest.py
      - name: judge/capture_selftest
        if: ${{ !cancelled() }}
        run: python3 eval/judge/capture_selftest.py
      # The same question pointed at the OTHER harness: `judge/static.py` stores what the
      # grader ran, `runner.py` stores what the agent's own gate said, and until #114 both
      # merged the two streams into one buffer -- so a Rust trial's stdout was thrown away
      # by a stderr flood (#100/#103). Mutants and variants both, and the variants run
      # against the UNFIXED capture so the defect is measured rather than assumed. Ungated
      # and unrecorded until 2026-08-27. 2.26s locally, of which 2.0 is a deliberate child
      # timeout, so it costs wall clock rather than CPU and does not move with the runner.
      - name: runner_capture_selftest (the agent harness's half of the capture question)
        if: ${{ !cancelled() }}
        run: python3 eval/runner_capture_selftest.py
      # Both offline and both under 0.1 s. `field_ranks` carries the guards that decide what
      # may be POOLED (a control must not enter a pooled figure), what may be RANKED
      # ACROSS STACKS (`idiomatic` and `framework_fluency` may not) and which RUN its
      # rounds came from (a submission id names different work in each run, #70/#80);
      # `weight_sensitivity`
      # is the tool any weighted aggregate here has to be swept with before publication,
      # and a sweep that reports STABLE on everything is indistinguishable from one that
      # cannot detect a flip. Neither was gated or recorded as excluded before 2026-08-24.
      - name: judge/field_ranks --selftest (pooling and cross-stack guards, both ways)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/field_ranks.py --selftest
      # The same run guard at the SWEEP end, where it is cheapest: a stored round judged
      # from another run in --out is refused before anything is written or paired, and a
      # round carrying no run at all is listed, not refused (#86 -- they predate the
      # provenance fields). Offline and under 0.1 s.
      - name: judge/field_sweep --selftest (the sweep refuses a foreign run in --out)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/field_sweep.py --selftest
      - name: judge/weight_sensitivity --selftest (can the sweep find a constructed flip?)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/weight_sensitivity.py --selftest
      # The play-bot suite itself lives in controls.yml because it drives fixtures through
      # `just`. This half needs neither: it asks whether `bot_mutants`'s own registry gate
      # and its pending-subject adjudication can go RED. A registry that cannot fail would
      # print a complete per-criterion census of a file that had drifted out from under it.
      # Its third arm reads `bot_pong._rally` over written tapes -- the games `ref_pong`'s
      # physics cannot be steered into, so no fixture and no `just` are involved.
      - name: judge/bot_mutants --selftest (the registry gate and the rally tapes, both ways)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/bot_mutants.py --selftest
      # `audio_regrade_census` is the producer for "how many stored verdicts does this
      # grader change move", which every change to the audio criteria owes. Its fixtures
      # are dicts and it decodes nothing, so it needs neither ffmpeg nor `just` -- unlike
      # `audio_selftest`, which is next door in controls.yml for exactly that reason.
      - name: judge/audio_regrade_census --selftest (the stored-verdict producer, both ways)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/audio_regrade_census.py --selftest
      # `host_perf_probe` is the producer for every figure in `eval/PERF-HOST.md`. Its four
      # measuring arms all need darwin and an exclusive machine -- `--caps` additionally needs
      # `taskpolicy`, and `--gpu`, `--spread` and `--drift` a Metal device -- and each refuses
      # by name off darwin. So what runs here is the ARITHMETIC those arms report through, with
      # a mutant per row. A percentile that quietly returned a mean, or a drift figure taken
      # against the minimum instead of the first bucket, would change every number in that
      # document while still printing one.
      - name: tools/host_perf_probe --selftest (the analysis the host arms report through)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/host_perf_probe.py --selftest
      # The two below run their SYNTHETIC half only. `eval/runs/` is gitignored, so the corpus
      # pins are NOT RUN here and say so in their own output -- read `0 corpus pins` as a
      # non-measurement, never as a pass. Run them with `--runs-root <a checkout>/eval/runs`
      # on the grading machine before quoting any figure they produce.
      - name: judge/discrimination --selftest (can THE RANKING TEST say CROSSES at all?)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/discrimination.py --selftest
      - name: judge/paired_verdicts --selftest (synthetic half; corpus pins need eval/runs)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/paired_verdicts.py --selftest
      # Three more census producers, offline on fixtures whose census is stated in
      # advance, all under 0.06s locally. `judge_ledger` pins the token-total arithmetic and the
      # missing-round refusals; `tier1_census` and `tier2_census` pin their trial
      # extraction with mutants. Each published no number that could be shown wrong
      # until task 180 named them; the mode census in `ci_minutes --controls` holds that
      # line from here.
      - name: judge/judge_ledger --selftest (the judge-spend producer's pins)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/judge_ledger.py --selftest
      - name: judge/tier1_census --selftest (the floor-test producer's pins)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/tier1_census.py --selftest
      - name: judge/tier2_census --selftest (the play-quality producer's pins)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/tier2_census.py --selftest
      # `regrade_wholegame` is the offline re-scoring path eval/AGENTS.md sends re-graders
      # to, and it mutates stored evidence under --write -- so a run directory that
      # cannot hold a regrade must be refused, never answered with the success line and
      # exit 0, which is what both failing shapes got until task 224. The fixtures are
      # written, not read from eval/runs, so this is offline; its mutant excises the
      # refusals out of the tool's own source and must turn them red.
      - name: judge/regrade_wholegame --selftest (the re-scoring path refuses an empty run dir)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/regrade_wholegame.py --selftest
      # The 2026-08-28 pre-registration's producer (task 201): what the stored non-code
      # judge rounds read against what their packs carried. Same shape as the three
      # above - a fixture tree whose every census answer is stated beside it, 0.048s
      # locally; the corpus half needs --runs-root and is NOT RUN here.
      - name: judge/prompt_capture_census --selftest (the latent-null producer's pins)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/prompt_capture_census.py --selftest
      # The PRODUCER side of that census: field.run_field's read capture. It stored
      # str(target)[:200] until 2026-08-28 (task 204), cutting the tail - the filename -
      # off any longer target, which is exactly why the census must refuse
      # exactly-200-character stored targets instead of classifying them. This drives
      # run_field with the `claude -p` subprocess stubbed the way blurb_selftest does,
      # and pins that a target past the old cap lands whole in tool_calls and
      # files_opened. Offline, no model, no network.
      - name: judge/files_opened_selftest (the audit capture stores the full read target)
        if: ${{ !cancelled() }}
        run: python3 eval/judge/files_opened_selftest.py
      # Task 202's corpus producer: the capture-geometry property the pack path's
      # first-frame read cannot see. Same shape - a fixture tree whose every census
      # answer is stated beside it, with the first-frame read itself pinned as the
      # mutant; the corpus half needs --runs-root and is NOT RUN here.
      - name: tools/frame_parity --selftest (the geometry census's pins)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/frame_parity.py --selftest
      # `eval/instrfollow/pool.py` is the instruction-count experiment's apparatus: 16
      # deterministic checkers, and its selftest is the gold artifact obeying all 16, a
      # mutant sweep requiring each mutant to flip exactly one checker, the variant
      # direction, and the fail-closed refusals -- over checked-in fixtures, no model in
      # the loop. 1.7s locally. It lives outside eval/tools and eval/judge, which is why task
      # 180's hand census over those two directories never saw it.
      - name: instrfollow/pool --selftest (16 checkers, mutant sweep, gold artifact)
        if: ${{ !cancelled() }}
        run: python3 eval/instrfollow/pool.py --selftest
      # `skill_layout_control.py` itself is in controls.yml: its five plants need the real
      # document corpus, and it takes ~125s. What runs here is the half that only shows up
      # when that control DIES -- it plants into the real working tree, so an interrupted run
      # is a repository state, and one left `.claude/skills` a directory of copies with the
      # next four gate runs red for a reason nothing named (tasks/147, tasks/150). Offline,
      # on a throwaway git repository, with a real SIGTERM and a real SIGKILL.
      - name: tools/skill_layout_selftest (an interrupted plant must not leave the tree broken)
        if: ${{ !cancelled() }}
        run: python3 eval/tools/skill_layout_selftest.py
